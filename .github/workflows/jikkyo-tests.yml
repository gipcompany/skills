name: jikkyo tests

# Scoped to skills/jikkyo so unrelated pushes don't burn a runner, plus the
# repository README, whose jikkyo section the tests read and run. The tests
# need bash, git, and jq (all preinstalled on ubuntu-latest); gh and claude are
# stubbed, so nothing here calls GitHub or starts a model.
on:
  push:
    paths: ['skills/jikkyo/**', 'README.md', '.github/workflows/jikkyo-tests.yml']
  pull_request:
    paths: ['skills/jikkyo/**', 'README.md', '.github/workflows/jikkyo-tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The helper-script tests take about five minutes on ubuntu-latest, so the
    # cap is ten: at five, a slow runner cancelled runs whose tests had all
    # passed. The cap matters because `pull_request` runs a fork's code on the
    # runner, and the default is six hours of someone else's compute.
    timeout-minutes: 10
    steps:
      # Pinned to a commit, not a tag: a tag is a movable pointer, so `@v4`
      # means "whatever actions/checkout points v4 at the moment this runs".
      # 11d5960 is v4.4.0. Bump it deliberately, with the tag in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # checkout leaves the job's token in .git/config by default, where
          # every later step can read it. Nothing here pushes or calls the API.
          persist-credentials: false

      - name: helper-script tests
        run: bash skills/jikkyo/tests/run.sh

      # shellcheck ships preinstalled on ubuntu-latest.
      - name: shellcheck
        run: shellcheck skills/jikkyo/scripts/*.sh skills/jikkyo/tests/*.sh
